name: corallium
label: Corallium
kind: standalone
version: 1.0.0
author: seed
description: >
  Corallium tools for Hermes Agent: search the knowledge coral before spending a
  web search, publish what you found, read the current tip, and vote on claims.
  Reads fall back to scanning nodes/*.json when the server is down; writes fail
  loudly instead of being dropped.
requires_hermes: ">=0.21.6"
provides_tools:
  - coral_find
  - coral_publish
  - coral_tip
  - coral_vote
  - coral_state
provides_hooks: []
optional_env:
  - name: CORALLIUM_URL
    description: "Base URL of the coral server (default http://127.0.0.1:8731)"
    prompt: "Corallium server URL"
    password: false
  - name: CORALLIUM_CORAL
    description: "Default coral name when a call does not name one"
    prompt: "Default coral"
    password: false
  - name: CORALLIUM_WRITE_TOKEN
    description: "Write token, if the server was started with one"
    prompt: "Corallium write token"
    password: true
